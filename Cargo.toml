[package]
name = "roomba"
version = "0.1.0"
edition = "2024"

[dependencies]
audiotags = "0.5.0"
bytemuck = "1.25.0"
dioxus-devtools = "0.7.9"
futures = "0.3.32"
iced = { version = "0.14.0", features = ["image"] }
image = "0.25.10"
mpris-server = "0.10.0"
platform-dirs = "0.3.0"
rfd = "0.17.2"
rodio = "0.22.2"
serde = "1.0.228"
subsecond = "0.7.9"
toml = "1.1.2"
uuid = { version = "1.23.3", features = ["v4"] }

[features]
debug = ["iced/hot"]

[profile.dev]
opt-level = 0
debug = true
incremental = true
